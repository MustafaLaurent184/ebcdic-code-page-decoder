[project]
name = "ebcdic-code-page-decoder"
version = "0.1.0"
description = "Decodes and encodes using IBM EBCDIC code page 037, used for mainframe data interchange."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
